services:
  postgres:
    image: postgres:16-alpine
    container_name: fourth-spark-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fourth_spark
      POSTGRES_PASSWORD: fourth_spark
      POSTGRES_DB: fourth_spark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fourth_spark"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
