name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|ci|perf|style|build|revert)(\(.+\))?!?: .+'; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <description>"
            echo "Types: feat | fix | docs | chore | refactor | test | ci | perf | style | build | revert"
            echo ""
            echo "Examples:"
            echo "  feat: add user authentication"
            echo "  fix(api): handle null response"
            echo "  docs: update contributing guide"
            exit 1
          fi

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - run: bun install --frozen-lockfile

      - name: Server unit tests
        run: bun run test:server

      - name: Web tests
        run: bun run test:web

  test-db:
    name: DB Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fourth_spark
          POSTGRES_PASSWORD: fourth_spark
          POSTGRES_DB: fourth_spark_test
        ports:
          - 5460:5432
        options: >-
          --health-cmd="pg_isready -U fourth_spark"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - run: bun install --frozen-lockfile

      - name: DB integration tests
        run: bun run test:db
        env:
          TEST_DATABASE_URL: postgresql://fourth_spark:fourth_spark@localhost:5460/fourth_spark_test
