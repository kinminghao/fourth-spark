name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: fourth-spark-linux-x64
          - target: bun-linux-arm64
            artifact: fourth-spark-linux-arm64
          - target: bun-darwin-x64
            artifact: fourth-spark-darwin-x64
          - target: bun-darwin-arm64
            artifact: fourth-spark-darwin-arm64
          - target: bun-windows-x64
            artifact: fourth-spark-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bash scripts/build.sh ${{ matrix.target }}

      - name: Package
        run: |
          cd dist/${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" .
          else
            tar czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: artifacts/*

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - run: bash scripts/build.sh

      - name: Publish to npm
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish dist/npm/ --access public --tag canary
          else
            npm publish dist/npm/ --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
