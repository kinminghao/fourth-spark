<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session File Preview Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#e5e5e5;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{max-width:480px;padding:2rem;border:1px solid #262626;border-radius:12px;background:#171717}
h1{font-size:1.25rem;margin-bottom:.75rem;color:#60a5fa}
p{font-size:.875rem;line-height:1.6;color:#a3a3a3;margin-bottom:.5rem}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-family:monospace}
.tag-green{background:#064e3b;color:#34d399}
.tag-blue{background:#1e3a5f;color:#60a5fa}
.tag-amber{background:#451a03;color:#fbbf24}
ul{list-style:none;margin-top:1rem}
ul li{padding:.375rem 0;border-top:1px solid #262626;font-size:.8125rem;display:flex;align-items:center;gap:.5rem}
ul li::before{content:"✓";color:#34d399;font-size:.75rem}
.footer{margin-top:1.5rem;text-align:center;font-size:.75rem;color:#525252}
</style>
</head>
<body>
<div class="card">
  <h1>Session File Preview</h1>
  <p>如果你能看到这个页面，说明文件预览功能工作正常。</p>
  <p>
    <span class="tag tag-green">git diff</span>
    <span class="tag tag-blue">sandbox</span>
    <span class="tag tag-amber">no-store</span>
  </p>
  <ul>
    <li>扩展名白名单过滤</li>
    <li>path.relative() 路径穿越防护</li>
    <li>lstatSync 符号链接拒绝</li>
    <li>CSP sandbox 隔离 HTML</li>
    <li>git diff changeset 访问控制</li>
  </ul>
  <div class="footer">Fourth Spark · preview-test.html</div>
</div>
</body>
</html>
